name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # github access token
  GIST_PAT: ${{ secrets.GIST_PAT }}
  
  # github username and gist id
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # token (use GIST_PAT)
  PUSH_TOKEN: ${{ secrets.GIST_PAT }}

  # network reachable
  REACHABLE: ${{ vars.REACHABLE }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Update config with GIST_LINK
        run: |
          # 从 GIST_LINK 解析 username 和 gist id
          USERNAME=$(echo "$GIST_LINK" | cut -d'/' -f1)
          GISTID=$(echo "$GIST_LINK" | cut -d'/' -f2)
          # 替换配置文件中的占位符
          sed -i "s/REPLACE_WITH_YOUR_GIST_ID/$GISTID/g" subscribe/config/config.json
          sed -i "s/\"username\": \"iosxx\"/\"username\": \"$USERNAME\"/g" subscribe/config/config.json
          echo "Config updated: username=$USERNAME, gistid=$GISTID"

      - name: Process
        run: python -u subscribe/process.py -s subscribe/config/config.json --overwrite

      - name: Timestamp
        run: date
